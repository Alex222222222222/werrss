[package]
name = "werrss"
version = "0.1.13"
edition = "2021"
description = "Architecture skeleton for a browser-driven WeChat public-account RSS service"
license = "MIT"

[profile.release]
# Keep release artifacts small without serializing code generation. Thin LTO
# removes cross-crate dead code while retaining more parallel build work than
# a single-codegen-unit release profile.
opt-level = "z"
lto = "thin"
panic = "abort"
strip = "symbols"

[dependencies]
anyhow = "1"
async-trait = "0.1"
askama = "0.14"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
ego-tree = "0.10"
envy = "0.4"
thirtyfour = { version = "0.37", default-features = false, features = ["rustls"] }
rand = "0.9"
rand_distr = "0.5"
regex = "1"
percent-encoding = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
ring = "0.17"
rss = "2.1"
scraper = "0.22"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "chrono", "uuid", "json", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
